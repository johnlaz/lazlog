<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
<title id="t">How LAZLOG works</title><desc id="d">A meal photo is compressed in the browser, sent to Groq with your key, returned as a rating and macros, then logged and scored in the daily verdict.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fb0ff"/></marker></defs>
<rect width="1200" height="330" rx="20" fill="#0d0f15"/>
<g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" text-anchor="middle">
<text x="600" y="48" font-size="24" font-weight="800" fill="#e8e6e1">From photo to verdict</text>
<g fill="#171a23" stroke="#2b3040" stroke-width="1.5"><rect x="40" y="95" width="236" height="150" rx="16"/><rect x="332" y="95" width="236" height="150" rx="16"/><rect x="624" y="95" width="236" height="150" rx="16"/><rect x="916" y="95" width="244" height="150" rx="16"/></g>
<g fill="#8fb0ff" font-size="15" font-weight="700"><text x="158" y="125">1 · SNAP</text><text x="450" y="125">2 · ESTIMATE</text><text x="742" y="125">3 · RATE</text><text x="1038" y="125">4 · LOG</text></g>
<g fill="#e8e6e1" font-size="18" font-weight="700"><text x="158" y="165">Meal photo</text><text x="450" y="165">Groq vision model</text><text x="742" y="165">Colour + macros</text><text x="1038" y="165">Timeline + verdict</text></g>
<g fill="#9a98a4" font-size="14"><text x="158" y="193">Compressed in your browser</text><text x="158" y="214">before it leaves the device</text><text x="450" y="193">Called directly with your</text><text x="450" y="214">own API key</text><text x="742" y="193">Calories, protein, carbs, fat</text><text x="742" y="214">and a digestion note</text><text x="1038" y="193">Saved to this device and</text><text x="1038" y="214">scored into the day badge</text></g>
<g stroke="#8fb0ff" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M280 170H326"/><path d="M572 170H618"/><path d="M864 170H910"/></g>
<g><circle cx="742" cy="270" r="7" fill="#3ddc84"/><circle cx="774" cy="270" r="7" fill="#f2c94c"/><circle cx="806" cy="270" r="7" fill="#f2994a"/><circle cx="838" cy="270" r="7" fill="#eb5757"/></g>
<text x="600" y="305" font-size="14" fill="#9a98a4">Green · Moderate · Caution · Watch this one</text>
</g></svg>

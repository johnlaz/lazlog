<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="t d">
<title id="t">LAZLOG architecture</title><desc id="d">GitHub Pages serves static files to the browser. The browser stores data in localStorage, caches with a service worker, and calls the Groq API directly with the user's key.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8fb0ff"/></marker></defs>
<rect width="1200" height="360" rx="20" fill="#0d0f15"/>
<g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Arial,sans-serif" text-anchor="middle">
<text x="600" y="44" font-size="24" font-weight="800" fill="#e8e6e1">Architecture</text>
<rect x="40" y="90" width="260" height="190" rx="16" fill="#171a23" stroke="#2b3040" stroke-width="1.5"/>
<text x="170" y="122" font-size="16" font-weight="700" fill="#8fb0ff">GITHUB PAGES</text>
<g font-size="15" fill="#e8e6e1"><text x="170" y="158">/index.html  (landing)</text><text x="170" y="184">/app/index.html  (app)</text><text x="170" y="210">/app/manifest.json</text><text x="170" y="236">/app/sw.js</text><text x="170" y="262" fill="#9a98a4">static files only</text></g>
<rect x="380" y="70" width="440" height="230" rx="16" fill="#171a23" stroke="#8fb0ff" stroke-width="1.8"/>
<text x="600" y="102" font-size="16" font-weight="700" fill="#8fb0ff">YOUR BROWSER / INSTALLED PWA</text>
<g fill="#0d0f15" stroke="#2b3040" stroke-width="1.2"><rect x="402" y="124" width="190" height="62" rx="10"/><rect x="608" y="124" width="190" height="62" rx="10"/><rect x="402" y="204" width="396" height="68" rx="10"/></g>
<g font-size="15" font-weight="700" fill="#e8e6e1"><text x="497" y="150">App UI + logic</text><text x="703" y="150">Service worker</text><text x="600" y="232">localStorage</text></g>
<g font-size="13" fill="#9a98a4"><text x="497" y="171">single-file HTML/JS</text><text x="703" y="171">offline cache</text><text x="600" y="253">logs · plan · grocery · scans · API key · model choice</text></g>
<rect x="900" y="110" width="260" height="150" rx="16" fill="#171a23" stroke="#2b3040" stroke-width="1.5"/>
<text x="1030" y="142" font-size="16" font-weight="700" fill="#8fb0ff">GROQ API</text>
<g font-size="15" fill="#e8e6e1"><text x="1030" y="178">chat/completions</text><text x="1030" y="204">models (list refresh)</text><text x="1030" y="236" fill="#9a98a4">only when you use AI</text></g>
<g stroke="#8fb0ff" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M304 185H374"/><path d="M824 185H894"/></g>
<text x="339" y="172" font-size="13" fill="#9a98a4">HTTPS</text><text x="859" y="172" font-size="13" fill="#9a98a4">your key</text>
<text x="600" y="336" font-size="14" fill="#9a98a4">No LAZLOG server. No account. No analytics.</text>
</g></svg>
